name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ps2-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FMCB 1.966 reference KELF requests ICVPS2
        run: |
          python3 - <<'PY'
          import struct
          import urllib.request

          url = "https://raw.githubusercontent.com/israpps/FreeMcBoot-Installer/master/installer_res/1966/INSTALL/SYSTEM/FMCB.XLF"
          data = urllib.request.urlopen(url, timeout=30).read()
          if len(data) < 0x20:
              raise SystemExit("FMCB.XLF is too small to contain a KELF header")
          elf_size, header_size, unknown5, flags, bit_count, mg_zones = struct.unpack_from("<IHHHHI", data, 0x10)
          print(f"FMCB.XLF bytes={len(data)} elf_size={elf_size} header_size={header_size} flags=0x{flags:04x} bit_count={bit_count} mg_zones=0x{mg_zones:08x}")
          print(f"Uses_ICVPS2={(flags >> 1) & 1}")
          if ((flags >> 1) & 1) != 1:
              raise SystemExit("Reference FMCB.XLF does not request ICVPS2")
          PY
      - name: Build stripped PS2 ELF with PS2DEV v2.0.0
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ps2dev/ps2dev:v2.0.0
          sh -c 'apk add --no-cache make >/dev/null && make clean && make release'
      - name: Record artifact checksum
        run: sha256sum PS2_MECHAPROBE.ELF | tee PS2_MECHAPROBE.ELF.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: PS2-MechaProbe
          path: |
            PS2_MECHAPROBE.ELF
            PS2_MECHAPROBE.ELF.sha256
            README.md
